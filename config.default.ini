# ==============================================================================
# Configuração do HEAD: Hardware Electrical Anomaly Detector
# Todos os parâmetros são injetados dinamicamente no pipeline sem hardcode.
# ==============================================================================

[audio]
# Dispositivo ALSA de captura ('default', 'hw:0,0' ou monitor virtual)
device = default
sample_rate = 48000
buffer_size = 4096

# Frequência fundamental da rede elétrica local (60Hz no Brasil/EUA, 50Hz Europa)
mains_frequency_hz = 60.0

# Razão mínima entre a harmônica da rede e o piso de ruído para alertar Ground Loop
hum_ratio_threshold = 3.0

# Faixa de análise espectral para EMI / Coil Whine
emi_band_start_hz = 2000.0
emi_band_end_hz = 12000.0

[power]
# Diretório base do subsistema hwmon no Linux
hwmon_base_dir = /sys/class/hwmon

# Limiar de desvio padrão máximo aceitável para ripple de voltagem (em mV)
max_ripple_stddev_mv = 35.0

# Tamanho da janela móvel de amostras elétricas
sample_history_size = 50

[bus]
# Diretório de dispositivos PCI
pci_base_dir = /sys/bus/pci/devices

# Verificar contadores de erro físico PCIe AER (Advanced Error Reporting)
check_aer_errors = true

[output]
# Ativar painel HUD ANSI interativo no terminal
enable_console_hud = true

# Ativar saída em JSON streaming estruturado (útil para pipe ou logs)
enable_json_stream = false

# Taxa de atualização visual da HUD (em milissegundos)
hud_refresh_rate_ms = 150
